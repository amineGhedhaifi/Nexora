<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Nexora is a modern online store with fast delivery and no account required to order."
    />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0b0d12"
      media="(prefers-color-scheme: dark)"
    />

    <link
      rel="preload"
      as="image"
      href="/images/hero/headphones.webp"
      fetchpriority="high"
    />

    <title>Nexora | Everything you need, delivered</title>

    <!--
      Sets the theme class BEFORE first paint so there is no light/dark flash.
      The storage key must match THEME_STORAGE_KEY in src/lib/constants.ts.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("nexora-theme");
          var theme =
            stored === "light" || stored === "dark" || stored === "system"
              ? stored
              : "system";
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          if (theme === "dark" || (theme === "system" && prefersDark)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
